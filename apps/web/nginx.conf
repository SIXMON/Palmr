# Palmr frontend nginx config — included by nginx:alpine's default
# /etc/nginx/nginx.conf via `include /etc/nginx/conf.d/*.conf;` (so this
# file already lives inside the `http { }` block — no wrappers here).
#
# Templated: BACKEND_HOST and BACKEND_PORT are interpolated by nginx's
# envsubst entrypoint before the daemon starts. Override via env vars
# in compose; defaults match the split-compose service DNS.
#
# Routing rules:
#
#   /api/*          → palmr-server:3333          (XHR from the SPA)
#   /e/{id}         → palmr-server:3333/embed/   (public embed; replaces
#                                                 the old Next.js route.ts)
#   /s/{alias}/     → static SPA scaffold for humans
#                     palmr-server:3333/og/s/    for known crawler UAs
#   /r/{alias}/     → static SPA scaffold for humans
#                     palmr-server:3333/og/r/    for known crawler UAs
#   /register-with-invite/{token}/  → static SPA scaffold
#   /*              → static export, SPA-style fallback to /index.html
#
# Bot UA matching is a denylist (well-known unfurlers + generic
# /bot|crawl|spider/). Humans always get the static page.
#
# DNS: a static `upstream` block (or a literal hostname in proxy_pass)
# resolves once at config-load time, which fails if the backend
# container isn't in DNS yet — Docker's embedded resolver (127.0.0.11)
# learns service names lazily and our compose doesn't gate the frontend
# behind a healthcheck. So each location uses a variable in proxy_pass,
# which defers resolution to request time and uses the resolver below.
# Side effect: variable proxy_pass disables nginx's automatic location-
# prefix stripping, so every location that strips a prefix (e.g.
# /api/foo → /foo) does it explicitly via `rewrite` or by including the
# target path in the proxy_pass URI.

resolver 127.0.0.11 valid=30s ipv6=off;

# gzip — Next.js artefacts are pre-compressed for `.js`/`.css` but on-the-
# fly responses (proxied JSON, OG HTML) still benefit.
gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

# $is_bot is "1" for known crawlers, "" otherwise. Reused by both /s/
# and /r/ locations so the list stays in one place.
map $http_user_agent $is_bot {
  default                  "";
  "~*slackbot"             "1";
  "~*facebookexternalhit"  "1";
  "~*twitterbot"           "1";
  "~*linkedinbot"          "1";
  "~*whatsapp"             "1";
  "~*telegrambot"          "1";
  "~*discordbot"           "1";
  "~*pinterest"            "1";
  "~*googlebot"            "1";
  "~*bingbot"              "1";
  "~*yandex"               "1";
  "~*baiduspider"          "1";
  "~*duckduckbot"          "1";
  "~*applebot"             "1";
  "~*ia_archiver"          "1";
  "~*bot"                  "1";
  "~*crawl"                "1";
  "~*spider"               "1";
}

# $wants_html is "1" when the client asked for HTML (browser path),
# empty otherwise. Used by /s/{alias} to split:
#   - Accept: text/html...  → SPA (humans on a browser)
#   - Accept: */*           → backend /shares/alias/{alias}/download
#                             (curl, wget, any HTTP client that didn't
#                              specifically ask for HTML)
# Browsers always send Accept: text/html,... at navigation time, and
# neither `curl` nor `wget` default ever sets text/html — so this
# heuristic separates the two reliably without User-Agent sniffing.
map $http_accept $wants_html {
  default        "";
  "~*text/html"  "1";
}

server {
  listen 5487;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  recursive_error_pages off;

  # Emit relative Location headers on auto-generated redirects (the
  # most common one being the trailing-slash add — Next.js export with
  # trailingSlash:true makes nginx 301 `/files` → `/files/`). With the
  # defaults (`absolute_redirect on; port_in_redirect on;`) the
  # Location would be `http://<host>:5487/files/` since this server
  # block sees the request as plain HTTP on port 5487 — the public
  # scheme/port lives at an edge proxy nginx doesn't know about.
  # Relative redirects sidestep that entirely: the browser resolves
  # them against the URL bar, which keeps the user's https://… origin.
  absolute_redirect off;
  port_in_redirect off;

  # -----------------------------------------------------------------------
  # /api/* — JSON API proxy. The backend mounts routes at /, so the /api
  # prefix is stripped via `rewrite` (auto-strip doesn't apply when
  # proxy_pass uses a variable).
  # -----------------------------------------------------------------------
  location /api/ {
    set $upstream "${BACKEND_HOST}:${BACKEND_PORT}";
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass         http://$upstream;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_read_timeout 5m;
    # Large multipart bodies (avatar/logo upload). Backend enforces its
    # own per-endpoint cap; this just keeps nginx from rejecting first.
    client_max_body_size 50m;
  }

  # -----------------------------------------------------------------------
  # /e/{id} — short public embed link. Replaces the old Next.js route.ts;
  # plain reverse proxy to /embed/{id} on the backend.
  # -----------------------------------------------------------------------
  location ~ ^/e/(?<embed_id>.+)$ {
    set $upstream "${BACKEND_HOST}:${BACKEND_PORT}";
    proxy_pass         http://$upstream/embed/$embed_id;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
  }

  # -----------------------------------------------------------------------
  # /s/{alias}/ — public share, three-way split on the same URL:
  #
  #   1. Known crawler UA           → backend /og/s/{alias}   (OG meta HTML)
  #   2. Client asks for text/html  → SPA scaffold            (browsers)
  #   3. Everything else            → backend /shares/alias/{alias}/download
  #                                    (curl, wget, scripts — 302 to S3
  #                                    for single-file shares, streaming
  #                                    zip for multi-file)
  #
  # Order matters: bot check before HTML check, since some bots (e.g.
  # the rare ones that still scrape with Accept: */*) would otherwise
  # fall through to the curl path. Curl and wget never set text/html
  # in their default Accept, so the HTML-vs-download split works
  # without User-Agent sniffing.
  #
  # Note: nginx loses positional regex captures ($1, $2…) when they cross
  # an `if` boundary inside the same location; named captures via
  # `?<name>` survive — see https://trac.nginx.org/nginx/ticket/1597.
  # -----------------------------------------------------------------------
  location ~ ^/s/(?<share_alias>[^/]+)/?$ {
    set $upstream "${BACKEND_HOST}:${BACKEND_PORT}";

    # Proxy settings live at location-scope because nginx `if` only
    # accepts a tiny set of directives (set, return, rewrite, and the
    # special-case proxy_pass + break pattern below). Setting these
    # outside the `if` is fine: they're only consumed if a proxy_pass
    # actually fires.
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_read_timeout 1h;
    proxy_buffering    off;

    if ($is_bot) {
      proxy_pass http://$upstream/og/s/$share_alias;
      break;
    }
    if ($wants_html = "") {
      # No text/html in Accept → treat as a programmatic download
      # client. Authorization (Basic auth) and X-Share-Password
      # headers flow through unchanged via the location-level
      # proxy_set_header config above.
      proxy_pass http://$upstream/shares/alias/$share_alias/download;
      break;
    }
    try_files /s/_.html =404;
  }

  # -----------------------------------------------------------------------
  # /r/{alias}/ — reverse share / upload landing. Same split.
  # -----------------------------------------------------------------------
  location ~ ^/r/(?<rshare_alias>[^/]+)/?$ {
    if ($is_bot) {
      set $upstream "${BACKEND_HOST}:${BACKEND_PORT}";
      proxy_pass http://$upstream/og/r/$rshare_alias;
      break;
    }
    try_files /r/_.html =404;
  }

  # -----------------------------------------------------------------------
  # /register-with-invite/{token}/ — same fallback pattern. No bot UA
  # split (invite links shouldn't be unfurled anywhere public).
  # -----------------------------------------------------------------------
  location ~ ^/register-with-invite/[^/]+/?$ {
    try_files /register-with-invite/_.html =404;
  }

  # -----------------------------------------------------------------------
  # Next.js static bundles — content-hashed filenames, long cache.
  # -----------------------------------------------------------------------
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # -----------------------------------------------------------------------
  # Everything else: serve the static file directly. With Next.js export
  # in trailingSlash:false mode, routes are flat .html files
  # (`/login` → `out/login.html`), so `$uri.html` is the primary match.
  # `$uri/index.html` covers the few routes Next.js emits as
  # directories (e.g. group-segment-only pages). `/index.html` final
  # fallback catches stray SPA routes that aren't pre-rendered.
  # -----------------------------------------------------------------------
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # /health for compose/k8s probes.
  location = /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}

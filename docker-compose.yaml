# =============================================================================
# Palmr — multi-container setup
# =============================================================================
#
# Services
#   traefik      — HTTP router that fans out /api → backend, / → frontend
#   minio        — S3-compatible object store (image: minio/minio)
#   minio-init   — one-shot job that creates the bucket on first boot
#   palmr-server — Fastify backend (Dockerfile: apps/server/Dockerfile)
#   palmr-web    — Next.js frontend  (Dockerfile: apps/web/Dockerfile)
#
# Public traffic shape
#   The web client makes API calls against /api/... on the same origin as the
#   page. Traefik strips the /api prefix and forwards them to palmr-server.
#   Everything else falls through to palmr-web. The frontend no longer needs
#   per-route Next.js proxy handlers — the router does it once for all of them.
#
# Most settings come from a `.env` file at the repo root. See `.env.example`
# for the full list of variables you need to set before first start.
#
# Quick start:
#   cp .env.example .env
#   # edit .env (especially the *_PASSWORD and *_SECRET fields)
#   docker compose up -d
#
# The legacy single-container image (kyantech/palmr:latest, built from the
# root Dockerfile with MinIO + server + web + supervisord baked in) is still
# usable — just check out an older docker-compose.yaml if you want it back.

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — only public-facing service. Configured entirely through
  # the bundled `traefik.yaml` static config (no Docker socket access, no
  # provider labels on the other containers) — the routing is fixed and
  # short enough that the file provider is the simplest option.
  #
  # If you already terminate TLS at an upstream proxy (Cloudflare, nginx,
  # another Traefik), point that upstream at this container's HTTP entrypoint
  # — no TLS config is needed here.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: palmr-traefik
    restart: unless-stopped
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Streaming uploads must not be cut off by Traefik — the backend already
      # enforces a body limit via MAX_BODY_SIZE_MB.
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=0"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "${WEB_PORT:-5487}:80"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    depends_on:
      palmr-server:
        condition: service_healthy
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Object storage (S3-compatible) — used by palmr-server via ENABLE_S3=true.
  # The web client also reaches MinIO directly for presigned uploads/downloads
  # via STORAGE_URL, so the API port is published on the host.
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: palmr-minio
    restart: unless-stopped
    command: server /data --address ":9379" --console-address ":9378"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9379}:9379"   # S3 API (must be reachable from browsers for presigned URLs)
      - "${MINIO_CONSOLE_PORT:-9378}:9378" # Admin console — keep behind a firewall in prod
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9379/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: creates the bucket once MinIO is healthy. Idempotent —
  # safe to leave in the compose file (it exits cleanly if the bucket exists).
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: palmr-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-palmr-files}
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo '[minio-init] configuring mc alias…';
      mc alias set palmr http://minio:9379 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      if mc ls palmr/$$MINIO_BUCKET >/dev/null 2>&1; then
        echo '[minio-init] bucket already exists, nothing to do';
      else
        echo '[minio-init] creating bucket' $$MINIO_BUCKET;
        mc mb palmr/$$MINIO_BUCKET;
        mc anonymous set none palmr/$$MINIO_BUCKET;
      fi;
      echo '[minio-init] done';
      "
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Backend (Fastify). Talks to MinIO via the docker network using the
  # S3-compatible API. The web frontend talks to it on the docker network via
  # API_BASE_URL=http://palmr-server:3333 — no need to publish the port unless
  # you want direct API access from the host.
  # ---------------------------------------------------------------------------
  palmr-server:
    build:
      # Context scoped to apps/server/ — the build doesn't need anything from
      # the rest of the monorepo. Seed support files (configs.json,
      # providers.json, check-missing.js) now live under prisma/ so they
      # travel with this context.
      context: ./apps/server
      dockerfile: Dockerfile
      args:
        PALMR_UID: ${PALMR_UID:-1001}
        PALMR_GID: ${PALMR_GID:-1001}
    image: ghcr.io/sixmon/palmr-server:latest
    container_name: palmr-server
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      # Auth / JWT — REQUIRED for production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 chars)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (comma-separated)}
      SECURE_SITE: ${SECURE_SITE:-true}
      MAX_BODY_SIZE_MB: ${MAX_BODY_SIZE_MB:-100}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      PRESIGNED_URL_EXPIRATION: ${PRESIGNED_URL_EXPIRATION:-3600}

      # External S3 — point at the in-cluster MinIO service
      ENABLE_S3: "true"
      S3_ENDPOINT: minio
      S3_PORT: "9379"
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${MINIO_BUCKET:-palmr-files}
      S3_REGION: ${MINIO_REGION:-us-east-1}

      # Public URL of MinIO — the BROWSER must be able to reach this, so it
      # has to be the host-reachable address, not the docker service name.
      STORAGE_URL: ${STORAGE_URL:?STORAGE_URL is required (browser-facing MinIO URL)}

      PALMR_UID: ${PALMR_UID:-1001}
      PALMR_GID: ${PALMR_GID:-1001}
    volumes:
      - server-data:/data
    # The host no longer needs to publish 3333 — Traefik routes /api/* to it
    # on the docker network. Uncomment the next block if you want direct
    # access from outside for debugging.
    # ports:
    #   - "${SERVER_PORT:-3333}:3333"
    healthcheck:
      # /health is on the API root (no `/api` prefix on the backend itself).
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3333/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # WIP — Go rewrite of the backend (apps/server-go). Same SQLite DB and
  # the same /data layout as the Node backend, so they can coexist for the
  # duration of the port.
  #
  # Behind the `go-backend` compose profile so it stays inert by default:
  #
  #     docker compose --profile go-backend build palmr-server-go
  #     docker compose --profile go-backend up -d palmr-server-go
  #
  # MVP scope (today): /health, /app/*, /auth/{login,logout,me,register},
  # /users/*. Everything else still has to be served by palmr-server. See
  # apps/server-go/README.md for the porting checklist.
  # ---------------------------------------------------------------------------
  palmr-server-go:
    profiles: ["go-backend"]
    build:
      context: ./apps/server-go
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: ghcr.io/sixmon/palmr-server-go:dev
    container_name: palmr-server-go
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 chars)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (comma-separated)}
      SECURE_SITE: ${SECURE_SITE:-true}
      MAX_BODY_SIZE_MB: ${MAX_BODY_SIZE_MB:-100}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      PRESIGNED_URL_EXPIRATION: ${PRESIGNED_URL_EXPIRATION:-3600}
      ENABLE_S3: "true"
      S3_ENDPOINT: minio
      S3_PORT: "9379"
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_NAME: ${MINIO_BUCKET:-palmr-files}
      S3_REGION: ${MINIO_REGION:-us-east-1}
      STORAGE_URL: ${STORAGE_URL:?STORAGE_URL is required}
      DATA_DIR: /data
    volumes:
      - server-data:/data
    ports:
      # Published on the host so you can smoke-test it side-by-side with
      # the Node backend (which keeps :3333 inside the docker network).
      - "${SERVER_GO_PORT:-3334}:3333"
    healthcheck:
      test: ["CMD", "/palmr-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Frontend (Next.js standalone). Static UI + SSR for the share/embed
  # routes. API calls from the browser go to `/api/*` on the same origin and
  # are routed by Traefik directly to palmr-server (used to be proxied
  # through Next.js route handlers — those are gone now). The SSR layouts
  # still need API_BASE_URL because they fetch from the server process,
  # which stays on the docker network.
  # ---------------------------------------------------------------------------
  palmr-web:
    build:
      # Context scoped to apps/web/ — nothing outside this app is needed.
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        PALMR_UID: ${PALMR_UID:-1001}
        PALMR_GID: ${PALMR_GID:-1001}
    image: ghcr.io/sixmon/palmr-web:latest
    container_name: palmr-web
    restart: unless-stopped
    depends_on:
      palmr-server:
        condition: service_healthy
    environment:
      API_BASE_URL: http://palmr-server:3333
      NEXT_PUBLIC_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
    # No host port — Traefik routes the catch-all (`/`) here.
    networks:
      - palmr

volumes:
  minio-data:
  server-data:

networks:
  palmr:
    driver: bridge

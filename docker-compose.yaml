# =============================================================================
# Palmr — multi-container setup
# =============================================================================
#
# Services
#   traefik      — HTTP router that fans out /api → backend, / → frontend
#   rustfs       — S3-compatible object store (image: rustfs/rustfs)
#   rustfs-init  — one-shot job that creates the bucket on first boot
#   palmr-server — Go backend         (Dockerfile: apps/server/Dockerfile)
#   palmr-web    — Next.js static export served by nginx (apps/web/Dockerfile)
#
# Public traffic shape
#   Traefik forwards everything to palmr-web (nginx). The nginx in that
#   container serves the static export and reverse-proxies /api/*, /e/{id},
#   and the crawler-targeted /og/* paths to palmr-server on the docker
#   network. There's no longer any Node runtime on the frontend side.
#
# Most settings come from a `.env` file at the repo root. See `.env.example`
# for the full list of variables you need to set before first start.
#
# Quick start:
#   cp .env.example .env
#   # edit .env (especially the *_PASSWORD and *_SECRET fields)
#   docker compose up -d
#
# The legacy single-container image (kyantech/palmr:latest, built from the
# root Dockerfile with MinIO + server + web + supervisord baked in) is still
# usable — just check out an older docker-compose.yaml if you want it back.

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy — only public-facing service. Configured entirely through
  # the bundled `traefik.yaml` static config (no Docker socket access, no
  # provider labels on the other containers) — the routing is fixed and
  # short enough that the file provider is the simplest option.
  #
  # If you already terminate TLS at an upstream proxy (Cloudflare, nginx,
  # another Traefik), point that upstream at this container's HTTP entrypoint
  # — no TLS config is needed here.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: palmr-traefik
    restart: unless-stopped
    command:
      - "--providers.file.filename=/etc/traefik/dynamic.yaml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Streaming uploads must not be cut off by Traefik — the backend already
      # enforces a body limit via MAX_BODY_SIZE_MB.
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=0"
      - "--accesslog=true"
      - "--log.level=INFO"
    ports:
      - "${WEB_PORT:-5487}:80"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
    depends_on:
      palmr-web:
        condition: service_healthy
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Object storage (S3-compatible) — RustFS. Used by palmr-server through
  # the AWS SDK and by browsers directly via STORAGE_URL for presigned
  # upload/download. The S3 API port is published on the host because
  # presigned URLs hand the browser an absolute URL to MinIO/RustFS.
  #
  # Why not MinIO: MinIO is AGPL-v3 (with a known "console clause" drift),
  # while RustFS is Apache-2.0. The Rust binary also idles on ~40 MB RAM
  # vs MinIO's ~150 MB on the same workload.
  # ---------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:1.0.0-beta.2
    container_name: palmr-rustfs
    restart: unless-stopped
    environment:
      # Single-volume single-node mode — the multi-volume erasure-coded
      # layout from the RustFS upstream compose is overkill for one
      # Docker host. Bump to /data/rustfs{0..3} + 4 volumes if you ever
      # want erasure coding here.
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      # Browsers POSTing to presigned URLs use the public hostname (e.g.
      # storage.example.com), which is a different origin than the
      # frontend — CORS must allow it. The S3 API CORS is system-level
      # in RustFS (RUSTFS_CORS_ALLOWED_ORIGINS — bucket-level CORS via
      # PutBucketCors is not yet enforced in beta.2: the call returns
      # 200 but GetBucketCors then reports NoSuchCORSConfiguration).
      # The layer that handles this *does* expose ETag in
      # Access-Control-Expose-Headers, which is what Uppy and Palmr's
      # multipart UI need to confirm parts.
      # Lock this down to the real browser origins in production.
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY is required}
      RUSTFS_OBS_LOGGER_LEVEL: info
    volumes:
      - rustfs-data:/data
    ports:
      - "${STORAGE_API_PORT:-9379}:9000"     # S3 API (must reach browsers for presigned URLs)
      - "${STORAGE_CONSOLE_PORT:-9378}:9001" # Admin console — keep behind a firewall in prod
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # One-shot bootstrap: creates the bucket once RustFS is healthy. Uses the
  # AWS CLI against the S3-compatible endpoint instead of `mc` (which is
  # MinIO-specific and uses admin endpoints RustFS doesn't expose).
  # Idempotent — `head-bucket` exits non-zero only when the bucket really
  # doesn't exist.
  #
  # CORS is configured server-wide on the rustfs service itself via
  # RUSTFS_CORS_ALLOWED_ORIGINS rather than per-bucket here. RustFS-beta.2
  # accepts PutBucketCors with HTTP 200 but doesn't persist it (GetBucketCors
  # then errors with NoSuchCORSConfiguration), so the env-var path is the
  # only one that actually works today.
  # ---------------------------------------------------------------------------
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: palmr-rustfs-init
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-palmr-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[rustfs-init] checking bucket $$STORAGE_BUCKET …"
        if aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$$STORAGE_BUCKET" 2>/dev/null; then
          echo "[rustfs-init] bucket already exists, nothing to do"
        else
          echo "[rustfs-init] creating bucket $$STORAGE_BUCKET"
          aws --endpoint-url http://rustfs:9000 s3 mb "s3://$$STORAGE_BUCKET"
        fi
        echo "[rustfs-init] done"
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Backend (Go). Talks to MinIO via the docker network using the
  # S3-compatible API. The web frontend talks to it on the docker network
  # via the nginx proxy in apps/web (BACKEND_HOST=palmr-server:3333) — no
  # need to publish the port unless you want direct API access from the
  # host.
  # ---------------------------------------------------------------------------
  palmr-server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    image: ghcr.io/sixmon/palmr-server-go:dev
    container_name: palmr-server
    restart: unless-stopped
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      # Auth / JWT — REQUIRED for production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (at least 32 chars)}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (comma-separated)}
      SECURE_SITE: ${SECURE_SITE:-true}
      MAX_BODY_SIZE_MB: ${MAX_BODY_SIZE_MB:-100}
      BCRYPT_COST: ${BCRYPT_COST:-12}
      PRESIGNED_URL_EXPIRATION: ${PRESIGNED_URL_EXPIRATION:-3600}

      # External S3 — point at the in-cluster RustFS service. The SDK
      # talks to it over the docker network; path-style addressing is
      # required (virtual-host style assumes wildcard DNS).
      ENABLE_S3: "true"
      S3_ENDPOINT: rustfs
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      S3_SECRET_KEY: ${STORAGE_SECRET_KEY}
      S3_BUCKET_NAME: ${STORAGE_BUCKET:-palmr-files}
      S3_REGION: ${STORAGE_REGION:-us-east-1}

      # Public URL of the storage service — the BROWSER must be able to
      # reach this, so it has to be the host-reachable address, not the
      # docker service name. Presigned URLs are signed against this host.
      STORAGE_URL: ${STORAGE_URL:?STORAGE_URL is required (browser-facing storage URL)}

      DATA_DIR: /data
    volumes:
      - server-data:/data
    # The host no longer needs to publish 3333 — the nginx in palmr-web
    # routes /api/* to it on the docker network. Uncomment the next block
    # for direct access from outside (debugging).
    # ports:
    #   - "${SERVER_PORT:-3333}:3333"
    healthcheck:
      test: ["CMD", "/palmr-server", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - palmr

  # ---------------------------------------------------------------------------
  # Frontend — Next.js static export served by nginx. The same nginx
  # reverse-proxies /api/* and the OG-tag paths to palmr-server on the
  # docker network, so the only env vars it needs are BACKEND_HOST +
  # BACKEND_PORT (resolved at request time via Docker's embedded DNS, so
  # the container survives backend restarts).
  # ---------------------------------------------------------------------------
  palmr-web:
    build:
      # Context scoped to apps/web/ — nothing outside this app is needed.
      context: ./apps/web
      dockerfile: Dockerfile
    image: ghcr.io/sixmon/palmr-web:latest
    container_name: palmr-web
    restart: unless-stopped
    environment:
      BACKEND_HOST: palmr-server
      BACKEND_PORT: "3333"
      NEXT_PUBLIC_DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en-US}
    # No host port — Traefik routes the catch-all (`/`) here.
    networks:
      - palmr

volumes:
  rustfs-data:
  server-data:

networks:
  palmr:
    driver: bridge

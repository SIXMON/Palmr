# =============================================================================
# Traefik dynamic configuration — Palmr stack
# =============================================================================
#
# Routing summary
#   /api/*  → palmr-server:3333  (with `/api` stripped before forward)
#   /*      → palmr-web:5487     (catch-all, lower priority)
#
# Backends are referenced by docker service name so the file works as-is
# inside the `palmr` docker network.
# =============================================================================

http:
  routers:
    palmr-api:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - web
      service: palmr-server
      # Higher priority so /api/* wins over the catch-all below.
      priority: 100
      middlewares:
        - strip-api-prefix

    palmr-web:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - web
      service: palmr-web
      priority: 1

  middlewares:
    # The Fastify routes have no `/api` prefix of their own — the legacy
    # Next.js proxy used to strip it before forwarding, so we mirror that.
    strip-api-prefix:
      stripPrefix:
        prefixes:
          - /api

  services:
    palmr-server:
      loadBalancer:
        servers:
          - url: "http://palmr-server-go:3333"
        # Disable Traefik's response buffering so SSE / large streaming
        # downloads aren't held in memory.
        passHostHeader: true

    palmr-web:
      loadBalancer:
        servers:
          - url: "http://palmr-web:5487"
        passHostHeader: true
